<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Ruta/Caja — control diario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header-left" id="header-left">
          <h1>Ruta<span class="slash">/</span>Caja</h1>
        </div>
        <div class="header-sub">
          <span class="live-dot off" id="live-dot"></span>
          en vivo
        </div>
      </header>

      <main id="app-content" class="app-content"></main>

      <nav class="tabbar" id="tabbar" style="display:none"></nav>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
